project:
  title:        "ZIRH"
  author:       "Hasan Melih Akbulut"
  discord:      "__hma"
  description:  "ZIRH: rad-hard experiment chip - TMR/ECC-protected CAN, SpaceWire-lite, RS422 and NPU with live SEU telemetry on SKY130."
  language:     "Verilog"
  clock_hz:     20000000

  tiles: "4x2"

  top_module:  "tt_um_hma_zirh"

  source_files:
    - "tt_um_hma_zirh.v"
    - "zirh_clk_rst.v"
    - "zirh_can.v"
    - "zirh_spw.v"
    - "zirh_rs422.v"
    - "zirh_npu.v"
    - "zirh_seu_mon.v"
    - "zirh_tlm.v"
    - "zirh_tmr_lib.v"     # voter, TMR FF sarmalayıcıları
